<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Terroir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Demo Data · Actions & Targets add-on (from the MyCellar team) -->
<style id="terroir-demo-style">#td-open{position:fixed;right:18px;bottom:18px;z-index:2147483000;background:#174d3b;color:white;border:0;border-radius:14px;padding:14px 20px;font:700 14px Arial;box-shadow:0 5px 22px #0003;cursor:pointer}#td-panel{display:none;position:fixed;inset:3% 3%;z-index:2147483001;background:#fafbf7;color:#18392d;border-radius:18px;box-shadow:0 0 0 200vmax #0009;overflow:auto;font:14px Arial;padding:24px}#td-panel *{box-sizing:border-box}#td-panel h2{margin:0 0 8px}#td-panel h3{margin:18px 0 9px}#td-panel button{cursor:pointer}#td-panel .td-btn{border:1px solid #b8c9bf;background:white;border-radius:9px;padding:10px 13px;margin:3px}#td-panel .td-primary{background:#174d3b;color:white}#td-panel .td-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px}#td-panel label{display:flex;flex-direction:column;gap:5px;font-weight:600}#td-panel input,#td-panel select{width:100%;border:1px solid #c7d5ce;border-radius:7px;padding:9px;background:white}#td-panel table{border-collapse:collapse;width:100%;min-width:540px}#td-panel td,#td-panel th{padding:9px;border-bottom:1px solid #dce5df;text-align:left}#td-panel .td-scroll{overflow-x:auto}#td-panel .td-card{background:white;border:1px solid #dae6df;border-radius:12px;padding:15px;margin:12px 0}#td-panel .td-tag{border-radius:6px;padding:4px 7px;background:#e6f0e8;display:inline-block}#td-panel .td-warn{background:#fff0d5}#td-panel .td-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#td-panel .td-muted{color:#62776b}#td-panel .td-tabs{margin:15px 0}#td-panel .td-tabs button[aria-selected=true]{background:#174d3b;color:white}@media print{body>*:not(#td-panel){display:none!important}#td-panel{position:static!important;display:block!important;box-shadow:none!important;inset:auto!important;overflow:visible!important}#td-panel button,#td-panel form{display:none!important}}</style>
<script id="terroir-demo-script">(function(){'use strict';
const KEY='terroir_full_demo_v1';const seed={batch:'LOT-2026-001',barrel:'B-001',activities:[['2026-09-15 09:20','Reception','Grapes received','Rkatsiteli · 1,200 kg'],['2026-09-15 11:00','Processing','Destemming & crushing','1,200 kg'],['2026-09-15 13:40','Processing','Pressing','780 L juice'],['2026-09-15 15:00','Allocation','Allocated to V-001','500 L'],['2026-09-15 15:10','Allocation','Allocated to V-002','280 L'],['2026-09-16 09:00','Fermentation','Fermentation started','V-001 · 18°C'],['2026-09-29 12:00','Fermentation','Fermentation completed','Residual sugar 3 g/L'],['2026-10-02 10:00','Wine Management','Racking','V-001 → B-001 · 470 L'],['2026-10-12 10:00','Wine Management','Laboratory analysis','B-001'],['2026-10-20 11:00','Bottling','Trial bottling','LOT-2026-001 · 60 bottles']],additions:[['2026-09-15 13:00','Processing','SO₂ / Potassium metabisulfite','1.5','g','DEMO-SO2-01'],['2026-09-16 09:10','Fermentation','Wine yeast','5','g','DEMO-YEAST-01'],['2026-09-16 09:30','Fermentation','Yeast nutrient / activator','4','g','DEMO-NUT-01'],['2026-10-03 11:00','Wine Management','Tannin','1','g','DEMO-TAN-01']],barrels:{'B-001':{volume:470,lab:{'pH':[3.35,3.30,3.20,3.40,'pH'],'Free SO₂':[18,25,20,30,'mg/L'],'Total Acidity':[6.4,6.5,6,7,'g/L'],'Residual Sugar':[3,3,0,4,'g/L'],'Temperature':[15,15,12,17,'°C']}},'B-002':{volume:280,lab:{'pH':[3.42,3.40,3.30,3.45,'pH'],'Free SO₂':[22,30,25,35,'mg/L'],'Total Acidity':[6.1,6,5.7,6.5,'g/L'],'Residual Sugar':[4,4,0,5,'g/L'],'Temperature':[16,15,12,17,'°C']}}}};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){data=JSON.parse(JSON.stringify(seed))}let tab='timeline';let barrel='B-001';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const tr=rows=>rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('');const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
function render(){const el=document.getElementById('td-panel');let body='';if(tab==='timeline'){body='<h3>Production timeline · '+esc(data.batch)+'</h3><div class="td-scroll"><table><tr><th>Date / time</th><th>Stage</th><th>Physical activity</th><th>Details</th></tr>'+tr(data.activities)+'</table></div><h3>Add physical activity</h3><form id="td-act" class="td-grid"><label>Date/time<input name="date" type="datetime-local" required></label><label>Stage<select name="stage"><option>Processing</option><option>Allocation</option><option>Fermentation</option><option>Wine Management</option><option>Bottling</option></select></label><label>Activity<input name="name" required placeholder="e.g. Racking"></label><label>Details<input name="details" placeholder="Volume / notes"></label><button class="td-btn td-primary">Add activity</button></form>'}
if(tab==='additions'){body='<h3>Additions & treatments</h3><p class="td-muted">Example demo records only; quantities are not dosing recommendations.</p><div class="td-scroll"><table><tr><th>Date/time</th><th>Stage</th><th>Product</th><th>Quantity</th><th>Unit</th><th>Supplier lot</th></tr>'+tr(data.additions)+'</table></div><h3>Record addition</h3><form id="td-add" class="td-grid"><label>Date/time<input name="date" type="datetime-local" required></label><label>Stage<select name="stage"><option>Processing</option><option>Fermentation</option><option>Wine Management</option></select></label><label>Product<select name="product"><option>SO₂ / Potassium metabisulfite</option><option>Wine yeast</option><option>Yeast nutrient / activator</option><option>Tannin</option><option>Other</option></select></label><label>Quantity<input name="quantity" type="number" step="any" min="0" required></label><label>Unit<select name="unit"><option>g</option><option>mg</option><option>kg</option><option>mL</option><option>L</option></select></label><label>Supplier lot<input name="lot" placeholder="Optional"></label><button class="td-btn td-primary">Save addition</button></form>'}
if(tab==='targets'){const b=data.barrels[barrel];body='<h3>Individual vessel / barrel targets</h3><label style="max-width:230px">Select barrel<select id="td-barrel">'+Object.keys(data.barrels).map(k=>'<option '+(k===barrel?'selected':'')+'>'+esc(k)+'</option>').join('')+'</select></label><p>'+esc(barrel)+' · '+esc(b.volume)+' L · Targets are saved independently for each barrel.</p><div class="td-scroll"><table><tr><th>Parameter</th><th>Actual</th><th>Target</th><th>Min</th><th>Max</th><th>Status</th></tr>'+Object.entries(b.lab).map(([k,v])=>{let status=v[0]<v[2]?'Below Target':v[0]>v[3]?'Above Target':'On Target';return '<tr><td>'+esc(k)+' ('+esc(v[4])+')</td>'+v.slice(0,4).map((n,i)=>'<td><input style="width:95px" type="number" step="any" data-param="'+esc(k)+'" data-index="'+i+'" value="'+esc(n)+'"></td>').join('')+'<td><span class="td-tag '+(status==='On Target'?'':'td-warn')+'">'+status+'</span></td></tr>'}).join('')+'</table></div><button class="td-btn td-primary" id="td-save-targets">Save targets & measurements</button><p class="td-muted">Statuses use the winemaker-defined minimum and maximum, not universal wine limits.</p>'}
if(tab==='trace'){body='<h3>Lot traceability · '+esc(data.batch)+'</h3><div class="td-card"><b>Grape → Processing → Vessel Allocation → Fermentation → Wine Management → Bottling</b><p>Variety: Rkatsiteli · Received: 1,200 kg · Pressed juice: 780 L · Vessels: V-001 / V-002 · Barrel: B-001</p><p>Physical activities: '+data.activities.length+' · Additions & treatments: '+data.additions.length+'</p><div id="td-qr" style="background:white;width:180px;height:180px;padding:10px;border:1px solid #ddd;display:grid;place-items:center">QR preview</div><p class="td-muted">QR opens this lot reference when hosted at a public URL. In a local HTML file it identifies the lot only.</p><button id="td-print" class="td-btn td-primary">Export / Save as PDF</button></div><h3>Lot events</h3><div class="td-scroll"><table><tr><th>Date/time</th><th>Stage</th><th>Activity</th><th>Details</th></tr>'+tr(data.activities)+'</table></div>'}
el.innerHTML='<div class="td-head"><div><h2>Terroir · Complete Demo Data</h2><div class="td-muted">'+esc(data.batch)+' · Editable sample production records</div></div><button class="td-btn" id="td-close">✕ Close</button></div><div class="td-tabs">'+[['timeline','Physical Activities'],['additions','Additions & Treatments'],['targets','Barrel Targets & Lab'],['trace','Traceability & PDF']].map(([k,v])=>'<button class="td-btn" data-tab="'+k+'" aria-selected="'+(k===tab)+'">'+v+'</button>').join('')+'</div><div class="td-card">'+body+'</div><button class="td-btn" id="td-reset">Reset demo data</button>';if(tab==='trace')qr(document.getElementById('td-qr'),data.batch);}
function qr(el,lot){const url='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(lot);el.innerHTML='<img width="160" height="160" alt="Lot QR code" src="'+url+'" onerror="this.replaceWith(document.createTextNode(\'QR unavailable offline\'))">';}
function open(){document.getElementById('td-panel').style.display='block';render()}
function init(){if(document.getElementById('td-open'))return;document.body.insertAdjacentHTML('beforeend','<button id="td-open">🍷 Demo Data · Actions & Targets</button><section id="td-panel" aria-label="Terroir demo data"></section>');document.getElementById('td-open').onclick=open;document.getElementById('td-panel').addEventListener('click',e=>{const x=e.target;if(x.id==='td-close')document.getElementById('td-panel').style.display='none';if(x.dataset.tab){tab=x.dataset.tab;render()}if(x.id==='td-reset'&&confirm('Reset demo records?')){data=JSON.parse(JSON.stringify(seed));save();render()}if(x.id==='td-save-targets'){for(const i of document.querySelectorAll('#td-panel [data-param]')){const n=Number(i.value);if(!Number.isFinite(n)){alert('Enter valid numbers');return}data.barrels[barrel].lab[i.dataset.param][Number(i.dataset.index)]=n}save();render()}if(x.id==='td-print')window.print()});document.getElementById('td-panel').addEventListener('change',e=>{if(e.target.id==='td-barrel'){barrel=e.target.value;render()}});document.getElementById('td-panel').addEventListener('submit',e=>{e.preventDefault();const f=e.target;const v=Object.fromEntries(new FormData(f));if(f.id==='td-act')data.activities.push([v.date.replace('T',' '),v.stage,v.name,v.details]);if(f.id==='td-add')data.additions.push([v.date.replace('T',' '),v.stage,v.product,v.quantity,v.unit,v.lot]);save();render()});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();</script>
  </body>
</html>
